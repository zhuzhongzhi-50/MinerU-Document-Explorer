<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1045" viewBox="0 0 1300 1045" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2f6fd0"/>
    </marker>
    <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5a86c8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="1045" fill="#ffffff"/>
  <text x="60" y="26" font-size="17" font-weight="bold" fill="#1f3a68">语音收集 + 文本专业生成 时序图（裁剪 TTS 链路 / 7 参与者 / 17 步）</text>

  <!-- ================= 参与者头部 ================= -->
  <!-- 用户（actor） -->
  <g stroke="#4a78c2" stroke-width="2" fill="none">
    <circle cx="60" cy="50" r="7"/>
    <line x1="60" y1="57" x2="60" y2="72"/>
    <line x1="49" y1="63" x2="71" y2="63"/>
    <line x1="60" y1="72" x2="51" y2="84"/>
    <line x1="60" y1="72" x2="69" y2="84"/>
  </g>
  <text x="60" y="98" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">用户</text>

  <g>
    <rect x="170" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="250" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">Vue 前端</text>
    <rect x="370" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="450" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">FastAPI WebSocket</text>
    <rect x="540" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="620" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">VoiceSession</text>
    <rect x="710" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="790" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">Fun-ASR</text>
    <rect x="890" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="970" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">LangChain Agent</text>
    <rect x="1090" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1170" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">知识库/业务工具</text>
  </g>

  <!-- ================= 生命线 ================= -->
  <g stroke="#b9c6d8" stroke-width="1.5">
    <line x1="60"   y1="100" x2="60"   y2="972"/>
    <line x1="250"  y1="78"  x2="250"  y2="972"/>
    <line x1="450"  y1="78"  x2="450"  y2="972"/>
    <line x1="620"  y1="78"  x2="620"  y2="972"/>
    <line x1="790"  y1="78"  x2="790"  y2="972"/>
    <line x1="970"  y1="78"  x2="970"  y2="972"/>
    <line x1="1170" y1="78"  x2="1170" y2="972"/>
  </g>

  <!-- ================= 组合片段框 ================= -->
  <!-- loop 1：约 100ms 音频分片 -->
  <rect x="205" y="245" width="620" height="167" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="205" y="237" width="46" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="228" y="250" font-size="12" fill="#555" text-anchor="middle">loop</text>
  <rect x="430" y="237" width="170" height="18" fill="#ffffff"/>
  <text x="515" y="251" font-size="12" fill="#555" text-anchor="middle">[约 100 ms 音频分片]</text>

  <!-- opt：Agent 需检索知识或调用工具 -->
  <rect x="935" y="517" width="285" height="123" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="935" y="509" width="40" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="955" y="522" font-size="12" fill="#555" text-anchor="middle">opt</text>
  <rect x="975" y="509" width="240" height="18" fill="#ffffff"/>
  <text x="1095" y="523" font-size="12" fill="#555" text-anchor="middle">[Agent 需检索知识或调用工具]</text>

  <!-- loop 2：LLM 专业文本流 -->
  <rect x="205" y="658" width="810" height="210" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="205" y="650" width="46" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="228" y="663" font-size="12" fill="#555" text-anchor="middle">loop</text>
  <rect x="460" y="650" width="130" height="18" fill="#ffffff"/>
  <text x="525" y="664" font-size="12" fill="#555" text-anchor="middle">[LLM 专业文本流]</text>

  <!-- ================= 消息 ================= -->
  <!-- 1 用户->Vue -->
  <text x="155" y="119" font-size="13" fill="#24354d" text-anchor="middle">点击开始并授权麦克风 / 选择专业生成模板</text>
  <line x1="66" y1="125" x2="240" y2="125" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="60" cy="125" r="10" fill="#2f6fd0"/><text x="60" y="129" font-size="11" fill="#fff" text-anchor="middle">1</text>

  <!-- 2 Vue->FastAPI -->
  <text x="350" y="154" font-size="13" fill="#24354d" text-anchor="middle">建立 /ws/voice</text>
  <line x1="256" y1="160" x2="440" y2="160" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="250" cy="160" r="10" fill="#2f6fd0"/><text x="250" y="164" font-size="11" fill="#fff" text-anchor="middle">2</text>

  <!-- 3 FastAPI->VoiceSession -->
  <text x="535" y="189" font-size="13" fill="#24354d" text-anchor="middle">创建会话并加载专业模板 / 知识库</text>
  <line x1="456" y1="195" x2="610" y2="195" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="450" cy="195" r="10" fill="#2f6fd0"/><text x="450" y="199" font-size="11" fill="#fff" text-anchor="middle">3</text>

  <!-- 4 VoiceSession回传Vue -->
  <text x="435" y="224" font-size="13" fill="#24354d" text-anchor="middle">session.ready / listening</text>
  <line x1="614" y1="230" x2="260" y2="230" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="620" cy="230" r="10" fill="#2f6fd0"/><text x="620" y="234" font-size="11" fill="#fff" text-anchor="middle">4</text>

  <!-- 5 Vue->VoiceSession -->
  <text x="435" y="279" font-size="13" fill="#24354d" text-anchor="middle">16 kHz PCM16 二进制数据</text>
  <line x1="256" y1="285" x2="610" y2="285" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="250" cy="285" r="10" fill="#2f6fd0"/><text x="250" y="289" font-size="11" fill="#fff" text-anchor="middle">5</text>

  <!-- 6 VoiceSession->Fun-ASR -->
  <text x="705" y="314" font-size="13" fill="#24354d" text-anchor="middle">send_audio_frame</text>
  <line x1="626" y1="320" x2="780" y2="320" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="620" cy="320" r="10" fill="#2f6fd0"/><text x="620" y="324" font-size="11" fill="#fff" text-anchor="middle">6</text>

  <!-- 7 Fun-ASR回传VoiceSession -->
  <text x="705" y="349" font-size="13" fill="#24354d" text-anchor="middle">partial transcript</text>
  <line x1="784" y1="355" x2="630" y2="355" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="790" cy="355" r="10" fill="#2f6fd0"/><text x="790" y="359" font-size="11" fill="#fff" text-anchor="middle">7</text>

  <!-- 8 VoiceSession回传Vue -->
  <text x="435" y="384" font-size="13" fill="#24354d" text-anchor="middle">stt.partial（实时转写）</text>
  <line x1="614" y1="390" x2="260" y2="390" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="620" cy="390" r="10" fill="#2f6fd0"/><text x="620" y="394" font-size="11" fill="#fff" text-anchor="middle">8</text>

  <!-- 9 Fun-ASR回传VoiceSession -->
  <text x="705" y="426" font-size="13" fill="#24354d" text-anchor="middle">final transcript</text>
  <line x1="784" y1="432" x2="630" y2="432" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="790" cy="432" r="10" fill="#2f6fd0"/><text x="790" y="436" font-size="11" fill="#fff" text-anchor="middle">9</text>

  <!-- 10 VoiceSession回传Vue -->
  <text x="435" y="461" font-size="13" fill="#24354d" text-anchor="middle">stt.final / thinking（锁定本轮语音）</text>
  <line x1="614" y1="467" x2="260" y2="467" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="620" cy="467" r="10" fill="#2f6fd0"/><text x="620" y="471" font-size="11" fill="#fff" text-anchor="middle">10</text>

  <!-- 11 VoiceSession->Agent -->
  <text x="795" y="496" font-size="13" fill="#24354d" text-anchor="middle">用户文本 + 专业生成指令(thread.id)</text>
  <line x1="626" y1="502" x2="960" y2="502" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="620" cy="502" r="10" fill="#2f6fd0"/><text x="620" y="506" font-size="11" fill="#fff" text-anchor="middle">11</text>

  <!-- 12 Agent->KB -->
  <text x="1070" y="556" font-size="13" fill="#24354d" text-anchor="middle">检索 / 调用工具（RAG、模板、Web Search）</text>
  <line x1="976" y1="562" x2="1160" y2="562" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="970" cy="562" r="10" fill="#2f6fd0"/><text x="970" y="566" font-size="11" fill="#fff" text-anchor="middle">12</text>

  <!-- 13 KB回传Agent -->
  <text x="1070" y="596" font-size="13" fill="#24354d" text-anchor="middle">检索结果 / 工具返回</text>
  <line x1="1164" y1="602" x2="980" y2="602" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="1170" cy="602" r="10" fill="#2f6fd0"/><text x="1170" y="606" font-size="11" fill="#fff" text-anchor="middle">13</text>

  <!-- 14 Agent回传VoiceSession -->
  <text x="795" y="692" font-size="13" fill="#24354d" text-anchor="middle">agent.delta（专业文本增量）</text>
  <line x1="964" y1="698" x2="630" y2="698" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="970" cy="698" r="10" fill="#2f6fd0"/><text x="970" y="702" font-size="11" fill="#fff" text-anchor="middle">14</text>

  <!-- 15 VoiceSession回传Vue -->
  <text x="435" y="727" font-size="13" fill="#24354d" text-anchor="middle">展示专业文本增量</text>
  <line x1="614" y1="733" x2="260" y2="733" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="620" cy="733" r="10" fill="#2f6fd0"/><text x="620" y="737" font-size="11" fill="#fff" text-anchor="middle">15</text>

  <!-- 16 VoiceSession回传Vue -->
  <text x="435" y="899" font-size="13" fill="#24354d" text-anchor="middle">agent.finished（专业文本完成 / 可校对导出）</text>
  <line x1="614" y1="905" x2="260" y2="905" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="620" cy="905" r="10" fill="#2f6fd0"/><text x="620" y="909" font-size="11" fill="#fff" text-anchor="middle">16</text>

  <!-- 17 用户->Vue -->
  <text x="155" y="934" font-size="13" fill="#24354d" text-anchor="middle">校对并导出专业文档</text>
  <line x1="66" y1="940" x2="240" y2="940" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="60" cy="940" r="10" fill="#2f6fd0"/><text x="60" y="944" font-size="11" fill="#fff" text-anchor="middle">17</text>

  <!-- ================= 参与者底部 ================= -->
  <g>
    <rect x="170" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="250" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">Vue 前端</text>
    <rect x="370" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="450" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">FastAPI WebSocket</text>
    <rect x="540" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="620" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">VoiceSession</text>
    <rect x="710" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="790" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">Fun-ASR</text>
    <rect x="890" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="970" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">LangChain Agent</text>
    <rect x="1090" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1170" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">知识库/业务工具</text>
  </g>
</svg>
