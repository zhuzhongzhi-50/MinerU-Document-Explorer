<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1045" viewBox="0 0 1400 1045" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2f6fd0"/>
    </marker>
    <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5a86c8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1045" fill="#ffffff"/>
  <text x="60" y="26" font-size="17" font-weight="bold" fill="#1f3a68">VoiceAgent 端到端时序图（4.1 完整合成版：20 步 / 8 参与者）</text>

  <!-- ================= 参与者头部 ================= -->
  <!-- 用户（actor） -->
  <g stroke="#4a78c2" stroke-width="2" fill="none">
    <circle cx="60" cy="50" r="7"/>
    <line x1="60" y1="57" x2="60" y2="72"/>
    <line x1="49" y1="63" x2="71" y2="63"/>
    <line x1="60" y1="72" x2="51" y2="84"/>
    <line x1="60" y1="72" x2="69" y2="84"/>
  </g>
  <text x="60" y="98" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">用户</text>

  <g>
    <rect x="150" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="230" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">Vue 前端</text>
    <rect x="350" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="430" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">FastAPI WebSocket</text>
    <rect x="520" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="600" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">VoiceSession</text>
    <rect x="680" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="760" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">Fun-ASR</text>
    <rect x="860" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="940" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">LangChain Agent</text>
    <rect x="1050" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1130" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">网络搜索/业务工具</text>
    <rect x="1240" y="42" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1320" y="65" font-size="14" font-weight="bold" fill="#1f3a68" text-anchor="middle">Qwen 双向 TTS</text>
  </g>

  <!-- ================= 生命线 ================= -->
  <g stroke="#b9c6d8" stroke-width="1.5">
    <line x1="60"   y1="100" x2="60"   y2="972"/>
    <line x1="230"  y1="78"  x2="230"  y2="972"/>
    <line x1="430"  y1="78"  x2="430"  y2="972"/>
    <line x1="600"  y1="78"  x2="600"  y2="972"/>
    <line x1="760"  y1="78"  x2="760"  y2="972"/>
    <line x1="940"  y1="78"  x2="940"  y2="972"/>
    <line x1="1130" y1="78"  x2="1130" y2="972"/>
    <line x1="1320" y1="78"  x2="1320" y2="972"/>
  </g>

  <!-- ================= 组合片段框 ================= -->
  <!-- loop 1：约 100ms 音频分片 -->
  <rect x="195" y="245" width="620" height="167" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="195" y="237" width="46" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="218" y="250" font-size="12" fill="#555" text-anchor="middle">loop</text>
  <rect x="430" y="237" width="170" height="18" fill="#ffffff"/>
  <text x="515" y="251" font-size="12" fill="#555" text-anchor="middle">[约 100 ms 音频分片]</text>

  <!-- opt：Agent 判断需要实时信息 -->
  <rect x="905" y="517" width="270" height="123" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="905" y="509" width="40" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="925" y="522" font-size="12" fill="#555" text-anchor="middle">opt</text>
  <rect x="945" y="509" width="225" height="18" fill="#ffffff"/>
  <text x="1057" y="523" font-size="12" fill="#555" text-anchor="middle">[Agent 判断需要实时信息]</text>

  <!-- loop 2：LLM 文本流 -->
  <rect x="195" y="658" width="1160" height="244" fill="none" stroke="#9aa7b8" stroke-dasharray="5 4"/>
  <rect x="195" y="650" width="46" height="18" fill="#ffffff" stroke="#9aa7b8"/>
  <text x="218" y="663" font-size="12" fill="#555" text-anchor="middle">loop</text>
  <rect x="700" y="650" width="120" height="18" fill="#ffffff"/>
  <text x="760" y="664" font-size="12" fill="#555" text-anchor="middle">[LLM 文本流]</text>

  <!-- ================= 消息 ================= -->
  <!-- 1 用户->Vue -->
  <text x="145" y="119" font-size="13" fill="#24354d" text-anchor="middle">点击开始并授权麦克风</text>
  <line x1="66" y1="125" x2="220" y2="125" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="60" cy="125" r="10" fill="#2f6fd0"/><text x="60" y="129" font-size="11" fill="#fff" text-anchor="middle">1</text>

  <!-- 2 Vue->FastAPI -->
  <text x="330" y="154" font-size="13" fill="#24354d" text-anchor="middle">建立 /ws/voice</text>
  <line x1="236" y1="160" x2="420" y2="160" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="230" cy="160" r="10" fill="#2f6fd0"/><text x="230" y="164" font-size="11" fill="#fff" text-anchor="middle">2</text>

  <!-- 3 FastAPI->VoiceSession -->
  <text x="515" y="189" font-size="13" fill="#24354d" text-anchor="middle">创建会话并启动服务</text>
  <line x1="436" y1="195" x2="590" y2="195" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="430" cy="195" r="10" fill="#2f6fd0"/><text x="430" y="199" font-size="11" fill="#fff" text-anchor="middle">3</text>

  <!-- 4 VoiceSession 回传 Vue -->
  <text x="415" y="224" font-size="13" fill="#24354d" text-anchor="middle">session.ready / listening</text>
  <line x1="594" y1="230" x2="240" y2="230" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="230" r="10" fill="#2f6fd0"/><text x="600" y="234" font-size="11" fill="#fff" text-anchor="middle">4</text>

  <!-- 5 Vue->VoiceSession -->
  <text x="415" y="279" font-size="13" fill="#24354d" text-anchor="middle">16 kHz PCM16 二进制数据</text>
  <line x1="236" y1="285" x2="590" y2="285" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="230" cy="285" r="10" fill="#2f6fd0"/><text x="230" y="289" font-size="11" fill="#fff" text-anchor="middle">5</text>

  <!-- 6 VoiceSession->Fun-ASR -->
  <text x="680" y="314" font-size="13" fill="#24354d" text-anchor="middle">send_audio_frame</text>
  <line x1="606" y1="320" x2="750" y2="320" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="600" cy="320" r="10" fill="#2f6fd0"/><text x="600" y="324" font-size="11" fill="#fff" text-anchor="middle">6</text>

  <!-- 7 Fun-ASR 回传 VoiceSession -->
  <text x="680" y="349" font-size="13" fill="#24354d" text-anchor="middle">partial transcript</text>
  <line x1="754" y1="355" x2="610" y2="355" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="760" cy="355" r="10" fill="#2f6fd0"/><text x="760" y="359" font-size="11" fill="#fff" text-anchor="middle">7</text>

  <!-- 8 VoiceSession 回传 Vue -->
  <text x="415" y="384" font-size="13" fill="#24354d" text-anchor="middle">stt.partial</text>
  <line x1="594" y1="390" x2="240" y2="390" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="390" r="10" fill="#2f6fd0"/><text x="600" y="394" font-size="11" fill="#fff" text-anchor="middle">8</text>

  <!-- 9 Fun-ASR 回传 VoiceSession -->
  <text x="680" y="426" font-size="13" fill="#24354d" text-anchor="middle">final transcript</text>
  <line x1="754" y1="432" x2="610" y2="432" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="760" cy="432" r="10" fill="#2f6fd0"/><text x="760" y="436" font-size="11" fill="#fff" text-anchor="middle">9</text>

  <!-- 10 VoiceSession 回传 Vue -->
  <text x="415" y="461" font-size="13" fill="#24354d" text-anchor="middle">stt.final / thinking</text>
  <line x1="594" y1="467" x2="240" y2="467" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="467" r="10" fill="#2f6fd0"/><text x="600" y="471" font-size="11" fill="#fff" text-anchor="middle">10</text>

  <!-- 11 VoiceSession->Agent -->
  <text x="770" y="496" font-size="13" fill="#24354d" text-anchor="middle">用户文本 + thread.id</text>
  <line x1="606" y1="502" x2="930" y2="502" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="600" cy="502" r="10" fill="#2f6fd0"/><text x="600" y="506" font-size="11" fill="#fff" text-anchor="middle">11</text>

  <!-- 12 Agent->Tools -->
  <text x="1035" y="556" font-size="13" fill="#24354d" text-anchor="middle">调用 web_search</text>
  <line x1="946" y1="562" x2="1120" y2="562" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="940" cy="562" r="10" fill="#2f6fd0"/><text x="940" y="566" font-size="11" fill="#fff" text-anchor="middle">12</text>

  <!-- 13 Tools 回传 Agent -->
  <text x="1035" y="596" font-size="13" fill="#24354d" text-anchor="middle">搜索摘要和来源链接</text>
  <line x1="1124" y1="602" x2="950" y2="602" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="1130" cy="602" r="10" fill="#2f6fd0"/><text x="1130" y="606" font-size="11" fill="#fff" text-anchor="middle">13</text>

  <!-- 14 Agent 回传 VoiceSession -->
  <text x="770" y="692" font-size="13" fill="#24354d" text-anchor="middle">agent.delta</text>
  <line x1="934" y1="698" x2="610" y2="698" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="940" cy="698" r="10" fill="#2f6fd0"/><text x="940" y="702" font-size="11" fill="#fff" text-anchor="middle">14</text>

  <!-- 15 VoiceSession 回传 Vue -->
  <text x="415" y="727" font-size="13" fill="#24354d" text-anchor="middle">展示回答增量</text>
  <line x1="594" y1="733" x2="240" y2="733" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="733" r="10" fill="#2f6fd0"/><text x="600" y="737" font-size="11" fill="#fff" text-anchor="middle">15</text>

  <!-- 16 VoiceSession->TTS -->
  <text x="960" y="762" font-size="13" fill="#24354d" text-anchor="middle">append_text</text>
  <line x1="606" y1="768" x2="1310" y2="768" stroke="#2f6fd0" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="600" cy="768" r="10" fill="#2f6fd0"/><text x="600" y="772" font-size="11" fill="#fff" text-anchor="middle">16</text>

  <!-- 17 TTS 回传 VoiceSession -->
  <text x="960" y="797" font-size="13" fill="#24354d" text-anchor="middle">24 kHz PCM16 音频分片</text>
  <line x1="1314" y1="803" x2="610" y2="803" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="1320" cy="803" r="10" fill="#2f6fd0"/><text x="1320" y="807" font-size="11" fill="#fff" text-anchor="middle">17</text>

  <!-- 18 VoiceSession 回传 Vue -->
  <text x="415" y="832" font-size="13" fill="#24354d" text-anchor="middle">二进制音频</text>
  <line x1="594" y1="838" x2="240" y2="838" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="838" r="10" fill="#2f6fd0"/><text x="600" y="842" font-size="11" fill="#fff" text-anchor="middle">18</text>

  <!-- 19 Vue 回传给用户 -->
  <text x="145" y="867" font-size="13" fill="#24354d" text-anchor="middle">边接收边播放</text>
  <line x1="224" y1="873" x2="70" y2="873" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="230" cy="873" r="10" fill="#2f6fd0"/><text x="230" y="877" font-size="11" fill="#fff" text-anchor="middle">19</text>

  <!-- 20 VoiceSession 回传 Vue -->
  <text x="415" y="934" font-size="13" fill="#24354d" text-anchor="middle">agent.finished / tts.finished</text>
  <line x1="594" y1="940" x2="240" y2="940" stroke="#5a86c8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arwD)"/>
  <circle cx="600" cy="940" r="10" fill="#2f6fd0"/><text x="600" y="944" font-size="11" fill="#fff" text-anchor="middle">20</text>

  <!-- ================= 参与者底部 ================= -->
  <g>
    <rect x="150" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="230" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">Vue 前端</text>
    <rect x="350" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="430" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">FastAPI WebSocket</text>
    <rect x="520" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="600" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">VoiceSession</text>
    <rect x="680" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="760" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">Fun-ASR</text>
    <rect x="860" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="940" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">LangChain Agent</text>
    <rect x="1050" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1130" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">网络搜索/业务工具</text>
    <rect x="1240" y="982" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#4a78c2"/>
    <text x="1320" y="1004" font-size="13" font-weight="bold" fill="#1f3a68" text-anchor="middle">Qwen 双向 TTS</text>
  </g>
</svg>
